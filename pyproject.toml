[project]
name = "syncode"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.5.1",
    "commitizen>=4.18.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.7",
]
[tool.commitizen]
name = "cz_customize"
version = "0.1.0"
tag_format = "v$version"


[tool.commitizen.customize]
schema_pattern = "(feat|fix|wip|chore) CS-\\d+: .{1,72}"
message_template = "{type} CS-{ticket}: {message}"
